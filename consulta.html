<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultar Inscrição</title>

    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/consulta.css">

</head>

<body>

<header>
    <h1>1ª Corrida de Nossa Senhora dos Remédios</h1>
    <p>19 de dezembro de 2026 • Buriti dos Lopes - PI</p>
</header>

<div class="container">

    <div class="card">

        <h2>Consultar Inscrição</h2>

        <p class="descricao">
            Informe seu CPF e sua data de nascimento para consultar
            a situação da sua inscrição.
        </p>

        <form id="formConsulta">

            <div class="campo">
                <label for="cpf">CPF</label>
                <input
                    type="text"
                    id="cpf"
                    maxlength="14"
                    placeholder="000.000.000-00"
                    required
                >
            </div>

            <div class="campo">
                <label for="nascimento">Data de nascimento</label>
                <input
                    type="date"
                    id="nascimento"
                    required
                >
            </div>

            <button type="submit" id="btnConsultar">
                Consultar inscrição
            </button>

        </form>

        <div id="mensagem"></div>

        <a href="index.html" class="voltar">
            ← Voltar para a página de inscrição
        </a>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://bsadzpxcxoeutockphjm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_2eNohK0WFyzO2R0Adx9-tg_e_WTPaQv";

const form = document.getElementById("formConsulta");
const mensagem = document.getElementById("mensagem");
const btnConsultar = document.getElementById("btnConsultar");

const cpfInput = document.getElementById("cpf");


// Máscara simples de CPF
cpfInput.addEventListener("input", function () {

    let valor = this.value.replace(/\D/g, "");

    if (valor.length > 11) {
        valor = valor.substring(0, 11);
    }

    valor = valor.replace(
        /(\d{3})(\d)/,
        "$1.$2"
    );

    valor = valor.replace(
        /(\d{3})(\d)/,
        "$1.$2"
    );

    valor = valor.replace(
        /(\d{3})(\d{1,2})$/,
        "$1-$2"
    );

    this.value = valor;
});


form.addEventListener("submit", async function (event) {

    event.preventDefault();

    mensagem.innerHTML = "";

    btnConsultar.disabled = true;
    btnConsultar.textContent = "Consultando...";

    const cpf = cpfInput.value;
    const nascimento =
        document.getElementById("nascimento").value;

    try {

        const resposta = await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/consultar_inscricao`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`
                },

                body: JSON.stringify({
                    p_cpf: cpf,
                    p_data_nascimento: nascimento
                })
            }
        );

        const dados = await resposta.json();

        if (!resposta.ok) {

            throw new Error(
                dados.message ||
                dados.error ||
                "Não foi possível consultar a inscrição."
            );
        }

        if (!dados || dados.length === 0) {

            mensagem.innerHTML = `
                <div class="erro">
                    <strong>Inscrição não encontrada.</strong><br>
                    Confira o CPF e a data de nascimento informados.
                </div>
            `;

            return;
        }

        const inscricao = dados[0];

        let classeStatus = "status-pendente";

        if (inscricao.status_pagamento === "CONFIRMADO") {
            classeStatus = "status-confirmado";
        }

        if (inscricao.status_pagamento === "CANCELADO") {
            classeStatus = "status-cancelado";
        }

        mensagem.innerHTML = `
            <div class="resultado">

                <h3>Inscrição encontrada!</h3>

                <strong>Protocolo:</strong>
                ${inscricao.protocolo}
                <br>

                <strong>Participante:</strong>
                ${inscricao.nome}
                <br>

                <strong>Percurso:</strong>
                ${inscricao.percurso}
                <br>

                <strong>Camisa:</strong>
                ${inscricao.tamanho_camisa}
                <br>

                <strong>Valor:</strong>
                R$ ${Number(inscricao.valor)
                    .toFixed(2)
                    .replace(".", ",")}
                <br>

                <strong>Status:</strong><br>

                <span class="status ${classeStatus}">
                    ${inscricao.status_pagamento}
                </span>

            </div>
        `;

    } catch (erro) {

        console.error(erro);

        mensagem.innerHTML = `
            <div class="erro">
                Ocorreu um erro ao consultar sua inscrição.
                Tente novamente.
            </div>
        `;

    } finally {

        btnConsultar.disabled = false;
        btnConsultar.textContent =
            "Consultar inscrição";
    }

});

</script>

</body>
</html>
