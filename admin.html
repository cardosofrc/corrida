<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo</title>

    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/admin.css">
    
</head>

<body>

    <header>
        <div>
            <h1>1ª Corrida de Nossa Senhora dos Remédios</h1>
            <p>Painel Administrativo</p>
        </div>

        <button id="btnSair">Sair</button>
    </header>


    <!-- LOGIN -->

    <div id="areaLogin" class="container">

        <div class="card login">

            <h2>🔐 Acesso administrativo</h2>

            <form id="formLogin">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required autocomplete="username">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required autocomplete="current-password">
                </div>

                <button class="btn-principal" type="submit">
                    Entrar
                </button>

            </form>

            <div id="mensagemLogin" class="mensagem"></div>

        </div>

    </div>


    <!-- PAINEL -->

    <div id="areaPainel">

        <div class="container">

            <div class="painel-topo">

                <div class="indicador">
                    <span>Total de inscrições</span>
                    <strong id="totalInscricoes">0</strong>
                </div>

                <div class="indicador">
                    <span>Pendentes</span>
                    <strong id="totalPendentes">0</strong>
                </div>

                <div class="indicador">
                    <span>Confirmadas</span>
                    <strong id="totalConfirmadas">0</strong>
                </div>

                <div class="indicador">
                    <span>Canceladas</span>
                    <strong id="totalCanceladas">0</strong>
                </div>

            </div>


            <div class="card">

                <h2 style="margin-bottom: 18px;">
                    Inscrições
                </h2>

                <div class="filtros">

                    <input type="text" id="busca" placeholder="Buscar por nome, CPF ou protocolo">

                    <select id="filtroPercurso">
                        <option value="">Todos os percursos</option>
                        <option value="3 km">3 km</option>
                        <option value="5 km">5 km</option>
                    </select>

                    <select id="filtroStatus">
                        <option value="">Todos os status</option>
                        <option value="PENDENTE">Pendente</option>
                        <option value="CONFIRMADO">Confirmado</option>
                        <option value="CANCELADO">Cancelado</option>
                    </select>

                    <select id="filtroTamanho">
                        <option value="">Todos os tamanhos</option>
                        <option value="P">P</option>
                        <option value="M">M</option>
                        <option value="G">G</option>
                        <option value="GG">GG</option>
                    </select>

                    <button class="btn-atualizar" onclick="carregarInscricoes()">
                        Atualizar
                    </button>

                </div>


                <div class="tabela-container">

                    <table>

                        <thead>

                            <tr>
                                <th>Protocolo</th>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Percurso</th>
                                <th>Camisa</th>
                                <th>Telefone</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>

                        </thead>

                        <tbody id="tabelaInscricoes"></tbody>

                    </table>

                </div>

                <div id="mensagemPainel" class="mensagem"></div>

            </div>

        </div>

    </div>

    <script src="js/admin.js"></script>

</body>

</html>
